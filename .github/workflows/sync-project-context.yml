name: Sync Project Context

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-project-context
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            requests \
            pyyaml

      - name: Sync project context from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python scripts/sync-project-context.py

      - name: Show generated changes
        run: |
          git status --short
          git diff --stat

      - name: Commit generated context
        run: |
          set -euo pipefail

          mapfile -t outputs < <(
            python scripts/sync-project-context.py --list-outputs
          )

          if [ "${#outputs[@]}" -eq 0 ]; then
            echo "No enabled outputs defined in config/project.sources.yaml"
            exit 1
          fi

          git add -- "${outputs[@]}"

          if git diff --cached --quiet; then
            echo "Project context is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Sync project context from Notion"
          git push origin HEAD:main

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Restore rclone configuration
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "ERROR: RCLONE_CONFIG_B64 secret is not set."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"

          echo "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "rclone configuration restored."

      - name: Publish project context to Google Drive
        env:
          GDRIVE_PROJECT_CONTEXT_FOLDER_ID: ${{ secrets.GDRIVE_PROJECT_CONTEXT_FOLDER_ID }}
        run: |
          bash scripts/publish-project-context-to-drive.sh
